name: Device

# The device-gated matrix from architecture.md §12: Android × {Maestro, Appium} and iOS × {Maestro, Appium}
# record → generate → save. Deliberately not on push — it boots emulators and takes minutes, so it runs
# nightly and on demand. Every job is opt-in via PWTAP_DEVICE=1 (the tests skip without it), so a missing
# CLI or an unavailable device shows as a skip rather than a red build for the wrong reason.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    # macOS, not Linux. The first nightly run failed with `no Platform implementation for 'linux'`:
    # `@pwtap/platform` branches on the host and only implements macOS, so the Linux runner could never have
    # worked. Running Android here too keeps CI on the one host the product actually supports — iOS requires
    # macOS anyway — at the cost of macOS runner minutes. The alternative is writing a `linux.ts`, which would
    # widen the supported-host claim and is a product decision, not a CI fix.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        driver: [maestro, appium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run build

      - name: Install Maestro CLI
        if: matrix.driver == 'maestro'
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Boots an AVD and runs the command inside it. The device test targets the Settings app, so nothing
      # has to be built or installed first.
      - name: Record against an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # The macOS runners are Apple silicon, so the emulator image has to match the host architecture;
          # an x86_64 image has no hardware acceleration here and boots far too slowly to be useful.
          arch: arm64-v8a
          target: google_apis
          profile: pixel_6
          avd-name: Pixel_6_API_34
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: >-
            PWTAP_DEVICE=1
            PWTAP_DEVICE_DRIVER=${{ matrix.driver }}
            PWTAP_DEVICE_PLATFORM=android
            npm run test:device

  ios:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        driver: [maestro, appium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Install Maestro CLI
        if: matrix.driver == 'maestro'
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The device test asserts against a device someone else booted — it never boots or shuts one down, so
      # that a device you were using is left as you left it. Without this step it simply SKIPPED, which reads
      # as a green run and made the whole iOS gate vacuous.
      - name: Boot a simulator
        run: |
          xcrun simctl list devices available
          xcrun simctl boot 'iPhone 16 Pro'
          xcrun simctl bootstatus 'iPhone 16 Pro' -b
          xcrun simctl list devices booted

      - name: Record against an iOS simulator
        env:
          PWTAP_DEVICE: '1'
          PWTAP_DEVICE_DRIVER: ${{ matrix.driver }}
          PWTAP_DEVICE_PLATFORM: ios
        run: npm run test:device
