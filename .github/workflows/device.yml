name: Device

# The device-gated half of architecture.md §12: iOS × {Maestro, Appium} record → generate → save. Deliberately
# not on push — it boots a simulator and takes minutes, so it runs nightly and on demand. Every job is opt-in via
# PWTAP_DEVICE=1 (the tests skip without it), so a missing CLI shows as a skip rather than a red build for the
# wrong reason.
#
# ANDROID IS NOT HERE, and this is why: the emulator cannot start on any runner this product supports. GitHub's
# macOS runners are Apple silicon (macos-26-arm64) and do not expose the Hypervisor framework to the VM, so every
# nightly died with `HVF error: HV_UNSUPPORTED` / `failed to initialize HVF: Invalid argument`, then timed out
# waiting for adb. Linux runners do have KVM, but `@pwtap/platform` implements macOS only and throws
# `no Platform implementation for 'linux'`. Two routes back, both product decisions rather than CI fixes: add a
# `linux.ts` platform implementation and run the emulator on `ubuntu-latest` with KVM, or use a self-hosted Intel
# Mac. Until then Android device coverage is the local `npm run test:device`, not CI.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        driver: [maestro, appium]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # Maestro runs on the JVM. The runner image ships a JDK, but pinning it here is what keeps a future image
      # change from failing as "maestro: command not found" three steps later.
      - uses: actions/setup-java@v4
        if: matrix.driver == 'maestro'
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run build

      - name: Install Maestro CLI
        if: matrix.driver == 'maestro'
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The device test asserts against a device someone else booted — it never boots or shuts one down, so that a
      # device you were using is left as you left it. Without this step it simply SKIPPED, which reads as a green
      # run and made the whole iOS gate vacuous.
      #
      # The device is CHOSEN, never named: `xcrun simctl boot 'iPhone 16 Pro'` failed every night with
      # `Invalid device or device pair` once the image moved to Xcode 26, whose simulators are iPhone 17/17e/16e.
      # A hardcoded model is a dated model.
      - name: Boot a simulator
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available --json | node -e "
            const runtimes = JSON.parse(require('fs').readFileSync(0, 'utf8')).devices;
            const phones = Object.keys(runtimes)
              .sort()
              .flatMap(runtime => runtimes[runtime].filter(device => device.name.startsWith('iPhone')));
            if (phones.length === 0) {
              console.error('[device] no iPhone simulator is available on this runner');
              process.exit(1);
            }
            const pick = phones[phones.length - 1];
            console.error('[device] booting ' + pick.name + ' (' + pick.udid + ')');
            console.log(pick.udid);
          ")
          # An already-booted device is success, not failure — `bootstatus` is the gate, so tolerating `boot`
          # here masks nothing: it still fails if the device never reaches Booted.
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices booted

      - name: Record against an iOS simulator
        env:
          PWTAP_DEVICE: '1'
          PWTAP_DEVICE_DRIVER: ${{ matrix.driver }}
          PWTAP_DEVICE_PLATFORM: ios
        run: npm run test:device
