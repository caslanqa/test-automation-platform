name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Type-check (build all packages)
        run: npm run build
      - name: Lint
        run: npm run lint
      # `tsc -b` covers the packages' `src/`, but not the tests (excluded from every package build so no
      # `*.test.js` reaches a published `dist/`) and not the React UI (vite builds it with esbuild, which
      # transpiles without type-checking). Both were therefore unverified until these two steps existed.
      - name: Type-check tests
        run: npm run typecheck:tests
      - name: Type-check inspector UI
        run: npm run typecheck:ui
      # The k6 load scripts @pwtap/plugin-perf ships are shipped CODE, and no build covers them: they live in
      # `templates/`, they import `k6/http`, and k6 itself strips TypeScript without checking any of it. Without
      # this step a type error in a scenario reaches users. Same project file the scaffolded `typecheck:perf` uses.
      - name: Type-check k6 load templates
        run: npm run typecheck:perf-templates
      # Also produces `ui-dist`, which the NFR size check and `npm pack` both need. Nothing else built
      # the UI bundle in CI, so a vite failure would only have surfaced at publish time.
      - name: Build inspector UI
        run: npm run build:ui -w @pwtap/mobile-inspector
      # The UI tests drive the real page in a real browser and skip without one, which would make them
      # silently worthless here. `ui-dist` is built by the step above; this adds the browser.
      - name: Install Chromium for the UI tests
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test
      - name: Smoke — scaffold a core-only project and verify it builds
        run: npm run smoke
      # Claude Code has no conditional component loading, so "no mobile plugin installed, no mobile agent" is a
      # property of OUR renderer and nothing else. This asserts it in both directions against a real scaffold, plus
      # the stdout contract a marketplace `command` source depends on — one line, absolute, exit 0 — which a single
      # stray console.info on the render path would break silently for every user.
      - name: Smoke — the rendered agent plugin and its capability gating
        run: npm run smoke:agents
      # The classifier reads real Playwright error strings, so it is coupled to someone else's output and
      # a silent reclassification after an upgrade is the failure mode. This runs a real browser against
      # two committed fixture versions where one change is a pure identifier change and the other a pure
      # value change — and requires that the value change is NOT treated as healable, which is the whole
      # difference between this engine and the official healer.
      - name: Smoke — failure triage, quarantine shielding and the gate
        run: npm run smoke:heal
      # The AI judge's calibration path is shipped tooling — a CLI, a labelled dataset, the metrics CI gates on —
      # and nothing here can reach a real model: there is no Ollama on a runner and no key in this repo. A local
      # fake gateway answers instead, which is also the only way to assert that a gate FIRES: it flips one verdict
      # on purpose and requires a non-zero exit naming the case.
      - name: Smoke — the judge's calibration workflow end to end
        run: npm run smoke:judge
      # The MCP server is hand-rolled JSON-RPC over stdio (ADR-015), and the class of bug that costs the most
      # there is framing: a stream delivers bytes, not messages, and a wrong assumption produces a server that
      # works on a fast machine and hangs on a slow one. Unit tests cover the framing; this runs the real shipped
      # binary as a real child process and talks to it with the MCP client this repo already ships. No device and
      # no network — the project it serves has no mobile plugin installed, which is the most common first contact
      # and the place a stack trace would be worst.
      - name: Smoke — the mobile MCP server over real stdio
        run: npm run smoke:mcp
      # Linux only, and deliberately: k6 is a Go binary running its own JavaScript engine, so the scenarios behave
      # identically on either runner, while `brew install k6` costs minutes of macOS CI time for no extra signal.
      # The first version of this step had no `if:` and ran the apt commands on macos-latest, where
      # /usr/share/keyrings does not exist — the ubuntu leg passed and the macOS one failed on gpg.
      #
      # Uses k6's own documented apt route, so this also exercises the instructions `ensure` prints. `mkdir -p` is
      # ours: the published snippet assumes the keyrings directory already exists.
      - name: Install k6
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /usr/share/keyrings
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6
          k6 version
      # Type-checking the k6 templates proves they compile; nothing proved they RUN. Both Phase 2 defects — VU pool
      # sizing and gating dropped_iterations in the wrong shapes — passed every static check and only a real run
      # found them. This runs the shipped smoke scenario against a local target, checks its thresholds genuinely
      # gate a failing one, and checks an unset PERF_TARGET_URL aborts.
      - name: Smoke — run the shipped k6 scenarios
        if: runner.os == 'Linux'
        run: npm run smoke:k6
      # The deterministic rows of the §11 budget: dependency footprint and published size. The latency
      # and idle-CPU rows need a real device, so they are measured by hand with
      # `PWTAP_DEVICE=1 npm run test:device` — there is no device workflow any more (architecture.md §12).
      - name: NFR budgets
        run: npm run nfr
