name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Type-check (build all packages)
        run: npm run build
      - name: Lint
        run: npm run lint
      # `tsc -b` covers the packages' `src/`, but not the tests (excluded from every package build so no
      # `*.test.js` reaches a published `dist/`) and not the React UI (vite builds it with esbuild, which
      # transpiles without type-checking). Both were therefore unverified until these two steps existed.
      - name: Type-check tests
        run: npm run typecheck:tests
      - name: Type-check inspector UI
        run: npm run typecheck:ui
      # The k6 load scripts @pwtap/plugin-perf ships are shipped CODE, and no build covers them: they live in
      # `templates/`, they import `k6/http`, and k6 itself strips TypeScript without checking any of it. Without
      # this step a type error in a scenario reaches users. Same project file the scaffolded `typecheck:perf` uses.
      - name: Type-check k6 load templates
        run: npm run typecheck:perf-templates
      # Also produces `ui-dist`, which the NFR size check and `npm pack` both need. Nothing else built
      # the UI bundle in CI, so a vite failure would only have surfaced at publish time.
      - name: Build inspector UI
        run: npm run build:ui -w @pwtap/mobile-inspector
      # The UI tests drive the real page in a real browser and skip without one, which would make them
      # silently worthless here. `ui-dist` is built by the step above; this adds the browser.
      - name: Install Chromium for the UI tests
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test
      - name: Smoke — scaffold a core-only project and verify it builds
        run: npm run smoke
      # The deterministic rows of the §11 budget: dependency footprint and published size. The latency
      # and idle-CPU rows need a device and live in device.yml.
      - name: NFR budgets
        run: npm run nfr
